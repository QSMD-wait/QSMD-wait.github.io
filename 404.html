<!-- ===================== 优化后的 Toast（青绿色系 + 根目录跳转） ===================== -->
<script>
  (function() {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function init() {
      setTimeout(function() {
        // 1. 创建 Toast 容器
        var toast = document.createElement('div');
        toast.id = 'custom-toast';
        
        // 2. 样式优化：青绿毛玻璃 + 微光动画
        toast.style.cssText = `
          position: fixed;
          bottom: 40px;
          left: 50%;
          transform: translateX(-50%) translateY(20px);
          background: rgba(10, 40, 40, 0.78);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
          color: #e0fdfc;
          padding: 16px 34px;
          border-radius: 50px;
          font-size: 17px;
          font-family: 'Mulish', 'Noto Serif SC', sans-serif;
          cursor: pointer;
          z-index: 99999;
          box-shadow: 0 8px 40px rgba(0, 180, 160, 0.25), inset 0 0 0 1px rgba(0, 255, 200, 0.15);
          letter-spacing: 0.8px;
          font-weight: 500;
          transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
          opacity: 0;
          user-select: none;
          white-space: nowrap;
          border: 1px solid rgba(0, 255, 200, 0.2);
          /* 微弱的呼吸光晕动画 */
          animation: toastGlow 3s ease-in-out infinite;
        `;

        // 3. 插入文字（使用青色系小叶子图标）
        toast.innerText = '🍃 页面迷路了，点击返回首页 →';

        // 4. 悬停交互：加深青绿底色，放大光效
        toast.addEventListener('mouseenter', function() {
          this.style.background = 'rgba(0, 150, 140, 0.85)';
          this.style.boxShadow = '0 8px 48px rgba(0, 220, 200, 0.5), inset 0 0 0 1px rgba(0, 255, 200, 0.5)';
          this.style.transform = 'translateX(-50%) translateY(0) scale(1.02)';
          this.style.borderColor = 'rgba(0, 255, 200, 0.6)';
        });
        toast.addEventListener('mouseleave', function() {
          this.style.background = 'rgba(10, 40, 40, 0.78)';
          this.style.boxShadow = '0 8px 40px rgba(0, 180, 160, 0.25), inset 0 0 0 1px rgba(0, 255, 200, 0.15)';
          this.style.transform = 'translateX(-50%) translateY(0) scale(1)';
          this.style.borderColor = 'rgba(0, 255, 200, 0.2)';
        });

        // 5. 点击跳转 —— 修正为根目录！
        toast.addEventListener('click', function() {
          window.location.href = '/'; // 永远指向网站根目录
        });

        document.body.appendChild(toast);

        // 6. 动态插入 @keyframes（因为样式是内联，需额外注入动画）
        var styleSheet = document.createElement("style");
        styleSheet.innerText = `
          @keyframes toastGlow {
            0% { box-shadow: 0 8px 40px rgba(0, 180, 160, 0.2), inset 0 0 0 1px rgba(0, 255, 200, 0.1); }
            50% { box-shadow: 0 8px 56px rgba(0, 220, 200, 0.45), inset 0 0 0 1px rgba(0, 255, 200, 0.3); }
            100% { box-shadow: 0 8px 40px rgba(0, 180, 160, 0.2), inset 0 0 0 1px rgba(0, 255, 200, 0.1); }
          }
        `;
        document.head.appendChild(styleSheet);

        // 7. 入场动画（淡入 + 上浮）
        requestAnimationFrame(function() {
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
        });

        // 8. 30 秒后自动淡出消失
        var autoHideTimer = setTimeout(function() {
          if (toast.parentNode) {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(30px)';
            toast.style.animation = 'none'; // 停止呼吸动画
            setTimeout(function() {
              if (toast.parentNode) toast.remove();
            }, 500);
          }
        }, 30000);

        // 9. 点击跳转时清理定时器（防止跳转前残留）
        toast.addEventListener('click', function() {
          clearTimeout(autoHideTimer);
        });

      }, 3000);
    }
  })();
</script>
<!-- ===================== Toast 结束 ===================== -->
