<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>青色漫地_wait</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="青色漫地_wait 的跳转中转页。" />
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="青色漫地_wait" />
  <meta property="og:description" content="青色漫地_wait 的跳转中转页。" />
  <meta name="theme-color" content="#0b1a2a" />

  <!-- 加载与 404 页面相同的字体 -->
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css?family=Mulish:400,400italic,700,700italic%7CNoto%20Serif%20SC:400,400italic,700,700italic&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Mulish:400,400italic,700,700italic%7CNoto%20Serif%20SC:400,400italic,700,700italic&display=swap" media="print" onload="this.media='all'">

  <style>
    /* =============================================
       重置 & 全局 – 深色为主，与 404 页面一致
       ============================================= */
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Mulish', 'Noto Serif SC', system-ui, -apple-system, sans-serif;
      background: #0b1a2a; /* fallback 深色 */
      color: #e6eef8;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    /* 背景图片 – 与 404 页面相同 (如不存在则使用渐变) */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('/images/banner.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.6) saturate(1.2);
      z-index: 0;
    }
    /* 如果图片加载失败，fallback 深色渐变 */
    @media (prefers-color-scheme: dark) {
      body::before { filter: brightness(0.4) saturate(0.8); }
    }

    /* 主卡片 – 毛玻璃效果，与 404 标题区域呼应 */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      margin: 20px;
      padding: 32px 40px 40px;
      background: rgba(10, 24, 40, 0.68);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    /* 标题 – 使用与 404 相同的层级感 */
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 0 0.2rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #b3e5fc, #81d4fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subhead {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.7);
      margin: 0 0 16px;
      font-weight: 400;
      line-height: 1.5;
    }
    .subhead strong {
      color: #81d4fa;
      font-weight: 600;
    }

    /* 进度条 – 青蓝渐变 */
    .track {
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      margin: 18px 0 8px;
    }
    .bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #3b82f6);
      border-radius: 999px;
      transition: width 80ms linear;
    }

    /* 倒计时状态 */
    .status {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      margin: 6px 0 16px;
      font-variant-numeric: tabular-nums;
    }

    /* 操作按钮 – 青色为主，红色取消 */
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 12px 0 16px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      font-family: inherit;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      min-width: 120px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: #fff;
      box-shadow: 0 8px 24px rgba(6, 182, 212, 0.3);
    }
    .btn-primary:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.5);
    }
    .btn-neutral {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e6eef8;
    }
    .btn-neutral:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
    }
    .btn-danger {
      background: #ef4444;
      color: #fff;
    }
    .btn-danger:hover {
      background: #dc2626;
      transform: scale(1.03);
    }

    .fallback {
      font-size: 0.9rem;
      color: #fcd34d;
      margin-top: 8px;
      min-height: 1.4em;
    }

    /* 底部设置栏 – 极简风格，与卡片融合 */
    .settings {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 16px 28px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.5);
    }
    .settings label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .settings select,
    .settings button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 4px 14px;
      color: #e6eef8;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .settings select:hover,
    .settings button:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
    }
    .settings .hint {
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.5;
      margin-top: 4px;
    }
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px,1px,1px,1px);
      white-space: nowrap;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .container { padding: 24px 20px; margin: 12px; }
      h1 { font-size: 1.6rem; }
      .btn { min-width: 100px; padding: 10px 18px; font-size: 0.9rem; }
      .settings { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <div class="container" role="main">
    <h1 id="pageTitle">页面即将跳转</h1>
    <p class="subhead" id="subtitle">
      <strong>页面会在短时间内自动跳转。</strong> 若需要中止，请点击“取消跳转”；
      若自动跳转被阻止，请使用“立即前往”或复制链接手动打开。
    </p>

    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" aria-label="跳转进度">
      <div class="bar" id="bar"></div>
    </div>
    <div class="status" id="statusText" aria-live="polite">3.00s 后跳转</div>

    <div class="actions" role="group" aria-label="操作">
      <a id="openNow" class="btn btn-primary" href="#" rel="noopener noreferrer">立即前往</a>
      <button id="copyBtn" class="btn btn-neutral" type="button">复制链接</button>
      <button id="cancelBtn" class="btn btn-danger" type="button">取消跳转</button>
    </div>

    <div id="fallbackNote" class="fallback" aria-live="polite"></div>
    <div id="ariaStatus" class="sr-only" aria-live="polite"></div>

    <!-- 设置区（语言 & 主题） -->
    <div class="settings" aria-label="设置">
      <label>
        语言
        <select id="langSelect">
          <option value="zh-CN">中文（简体）</option>
          <option value="zh-TW">中文（繁體）</option>
          <option value="en-US">English</option>
          <option value="es-ES">Español</option>
          <option value="fr-FR">Français</option>
        </select>
      </label>
      <label>
        主题
        <button id="themeToggle" class="theme-btn" aria-pressed="false">自动</button>
      </label>
      <div class="hint" id="panelHint">保存的语言与主题偏好将存储在本地。</div>
    </div>
  </div>

  <script>
    /* =========================================================
       以下脚本完全保留原跳转页的全部功能（倒计时、国际化、主题切换）
       仅将主题切换的逻辑调整为匹配新的深色风格（但依然保留 light/dark/auto 选项）
       ========================================================= */

    const TARGET = "https://qsmd-wait.netlify.app/";
    const DELAY_MS = 3000;
    const NAV_PROBE_MS = 700;

    // ---------- 国际化文本 ----------
    const I18N = {
      "zh-CN": {
        title: "页面即将跳转",
        subtitle: "页面会在短时间内自动跳转。若需要中止，请点击“取消跳转”。若自动跳转被阻止，请使用“立即前往”或复制链接手动打开。",
        openNow: "立即前往",
        copy: "复制链接",
        copied: "已复制",
        cancel: "取消跳转",
        fallback: "检测到自动跳转未生效，已停止并提供手动选项。",
        countdownFmt: t => t.toFixed(2) + "s 后跳转",
        panelHint: "保存的语言与主题偏好将存储在本地。",
        themeAuto: "自动",
        themeLight: "浅色",
        themeDark: "深色"
      },
      "zh-TW": {
        title: "頁面即將跳轉",
        subtitle: "頁面會在短時間內自動跳轉。若需中止，請點選「取消跳轉」。若自動跳轉被阻擋，請使用「立即前往」或複製連結手動開啟。",
        openNow: "立即前往",
        copy: "複製連結",
        copied: "已複製",
        cancel: "取消跳轉",
        fallback: "偵測到自動跳轉未生效，已停止並提供手動選項。",
        countdownFmt: t => t.toFixed(2) + "s 後跳轉",
        panelHint: "儲存的語言與主題偏好將保存在本機。",
        themeAuto: "自動",
        themeLight: "淺色",
        themeDark: "深色"
      },
      "en-US": {
        title: "Redirecting shortly",
        subtitle: "The page will automatically redirect shortly. To stop it, click Cancel. If auto-redirect is blocked, use Open now or copy the link to open manually.",
        openNow: "Open now",
        copy: "Copy link",
        copied: "Copied",
        cancel: "Cancel redirect",
        fallback: "Auto-redirect appears blocked. Manual options are available.",
        countdownFmt: t => t.toFixed(2) + "s until redirect",
        panelHint: "Saved language and theme preferences are stored locally.",
        themeAuto: "Auto",
        themeLight: "Light",
        themeDark: "Dark"
      },
      "es-ES": {
        title: "Redirigiendo en breve",
        subtitle: "La página redirigirá automáticamente en breve. Para detenerlo, haga clic en Cancelar. Si se bloquea, use Abrir ahora o copie el enlace.",
        openNow: "Abrir ahora",
        copy: "Copiar enlace",
        copied: "Copiado",
        cancel: "Cancelar redirección",
        fallback: "Parece que la redirección automática fue bloqueada. Opciones manuales disponibles.",
        countdownFmt: t => t.toFixed(2) + "s hasta la redirección",
        panelHint: "Las preferencias se guardan localmente.",
        themeAuto: "Auto",
        themeLight: "Claro",
        themeDark: "Oscuro"
      },
      "fr-FR": {
        title: "Redirection imminente",
        subtitle: "La page redirigera automatiquement sous peu. Pour l'arrêter, cliquez sur Annuler. Si bloqué, utilisez Ouvrir maintenant ou copiez le lien.",
        openNow: "Ouvrir maintenant",
        copy: "Copier le lien",
        copied: "Copié",
        cancel: "Annuler la redirection",
        fallback: "La redirection automatique semble bloquée. Options manuelles disponibles.",
        countdownFmt: t => t.toFixed(2) + "s avant la redirection",
        panelHint: "Les préférences sont stockées localement.",
        themeAuto: "Auto",
        themeLight: "Clair",
        themeDark: "Sombre"
      }
    };

    // ---------- DOM 缓存 ----------
    const DOM = {
      bar: document.getElementById('bar'),
      statusText: document.getElementById('statusText'),
      fallbackNote: document.getElementById('fallbackNote'),
      ariaStatus: document.getElementById('ariaStatus'),
      openNow: document.getElementById('openNow'),
      copyBtn: document.getElementById('copyBtn'),
      cancelBtn: document.getElementById('cancelBtn'),
      langSelect: document.getElementById('langSelect'),
      themeToggle: document.getElementById('themeToggle'),
      pageTitle: document.getElementById('pageTitle'),
      subtitle: document.getElementById('subtitle'),
      panelHint: document.getElementById('panelHint')
    };

    // ---------- 语言 / 主题 检测 ----------
    function detectLang() {
      const stored = localStorage.getItem('cm_lang');
      if (stored && I18N[stored]) return stored;
      const nav = navigator.language || navigator.userLanguage || 'en-US';
      if (nav.startsWith('zh-TW') || nav.startsWith('zh-HK')) return 'zh-TW';
      if (nav.startsWith('zh')) return 'zh-CN';
      if (nav.startsWith('es')) return 'es-ES';
      if (nav.startsWith('fr')) return 'fr-FR';
      return 'en-US';
    }
    function detectTheme() {
      const stored = localStorage.getItem('cm_theme');
      if (stored) return stored; // 'auto'|'light'|'dark'
      return 'auto';
    }

    let currentLang = detectLang();
    let currentTheme = detectTheme();
    let countdownActive = true;
    let cancelled = false;
    let redirected = false;
    let startTs = null;
    let raf = null;

    // ---------- 应用国际化 ----------
    function applyI18n(lang) {
      const t = I18N[lang] || I18N['en-US'];
      DOM.pageTitle.textContent = t.title;
      document.title = "青色漫地_wait";
      DOM.subtitle.textContent = t.subtitle;
      DOM.openNow.textContent = t.openNow;
      DOM.copyBtn.textContent = t.copy;
      DOM.cancelBtn.textContent = t.cancel;
      DOM.panelHint.textContent = t.panelHint;
      if (countdownActive) {
        DOM.statusText.textContent = t.countdownFmt(DELAY_MS / 1000);
      } else {
        DOM.statusText.textContent = '';
      }
      DOM.ariaStatus.textContent = t.title;
    }

    // ---------- 应用主题（适配深色背景） ----------
    function applyTheme(theme) {
      const body = document.body;
      if (theme === 'auto') {
        const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        const prefersDark = mq ? mq.matches : true; // 默认深色
        body.style.background = prefersDark ? '#0b1a2a' : '#dce8f0';
        DOM.themeToggle.textContent = (I18N[currentLang] && I18N[currentLang].themeAuto) || '自动';
        DOM.themeToggle.setAttribute('aria-pressed', prefersDark ? 'true' : 'false');
      } else if (theme === 'dark') {
        body.style.background = '#0b1a2a';
        DOM.themeToggle.textContent = (I18N[currentLang] && I18N[currentLang].themeDark) || '深色';
        DOM.themeToggle.setAttribute('aria-pressed', 'true');
      } else { // light
        body.style.background = '#dce8f0';
        DOM.themeToggle.textContent = (I18N[currentLang] && I18N[currentLang].themeLight) || '浅色';
        DOM.themeToggle.setAttribute('aria-pressed', 'false');
      }
      // 调整卡片文字颜色（浅色模式下文字变深）
      const container = document.querySelector('.container');
      if (theme === 'light') {
        container.style.color = '#0f1724';
        container.style.background = 'rgba(255,255,255,0.75)';
        container.style.borderColor = 'rgba(0,0,0,0.05)';
      } else {
        container.style.color = '#e6eef8';
        container.style.background = 'rgba(10,24,40,0.68)';
        container.style.borderColor = 'rgba(255,255,255,0.08)';
      }
    }

    // ---------- 初始化控件 ----------
    function initControls() {
      DOM.langSelect.value = currentLang;
      DOM.langSelect.addEventListener('change', (e) => {
        currentLang = e.target.value;
        localStorage.setItem('cm_lang', currentLang);
        applyI18n(currentLang);
        applyTheme(currentTheme);
      });

      DOM.themeToggle.addEventListener('click', () => {
        if (currentTheme === 'auto') currentTheme = 'light';
        else if (currentTheme === 'light') currentTheme = 'dark';
        else currentTheme = 'auto';
        localStorage.setItem('cm_theme', currentTheme);
        applyTheme(currentTheme);
      });

      DOM.openNow.href = TARGET;
      DOM.openNow.addEventListener('click', () => cancelAuto(true));

      DOM.copyBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(TARGET);
          DOM.copyBtn.textContent = (I18N[currentLang] && I18N[currentLang].copied) || '已复制';
          setTimeout(() => DOM.copyBtn.textContent = (I18N[currentLang] && I18N[currentLang].copy) || '复制链接', 1200);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = TARGET;
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch(_) {}
          document.body.removeChild(ta);
        }
        cancelAuto(true);
      });

      DOM.cancelBtn.addEventListener('click', () => cancelAuto(true));
    }

    // ---------- 进度 & 跳转逻辑 ----------
    function tick(ts) {
      if (!startTs) startTs = ts;
      const elapsed = ts - startTs;
      const remaining = Math.max(0, DELAY_MS - elapsed);
      const pct = Math.max(0, Math.min(100, (remaining / DELAY_MS) * 100));
      DOM.bar.style.width = pct + '%';

      if (countdownActive) {
        DOM.statusText.textContent = (I18N[currentLang] && I18N[currentLang].countdownFmt(remaining / 1000)) || (remaining / 1000).toFixed(2) + 's';
        DOM.ariaStatus.textContent = DOM.statusText.textContent;
      } else {
        DOM.statusText.textContent = '';
      }

      if (elapsed < DELAY_MS && !cancelled) {
        raf = requestAnimationFrame(tick);
      } else if (!cancelled && !redirected) {
        redirected = true;
        try {
          window.location.replace(TARGET);
          setTimeout(() => {
            if (!document.hidden) handleBlocked();
          }, NAV_PROBE_MS);
        } catch (e) {
          handleBlocked();
        }
      }
    }

    function handleBlocked() {
      cancelled = true;
      countdownActive = false;
      if (raf) cancelAnimationFrame(raf);
      DOM.bar.style.width = '100%';
      DOM.fallbackNote.textContent = (I18N[currentLang] && I18N[currentLang].fallback) || '跳转被阻止';
      DOM.statusText.textContent = '';
      DOM.ariaStatus.textContent = DOM.fallbackNote.textContent;
      DOM.openNow.focus();
    }

    function cancelAuto(userInitiated) {
      cancelled = true;
      countdownActive = false;
      if (raf) cancelAnimationFrame(raf);
      DOM.bar.style.width = '100%';
      if (userInitiated) {
        DOM.fallbackNote.textContent = (I18N[currentLang] && I18N[currentLang].cancel) || '已取消';
        DOM.statusText.textContent = '';
        DOM.ariaStatus.textContent = DOM.fallbackNote.textContent;
      } else {
        DOM.fallbackNote.textContent = (I18N[currentLang] && I18N[currentLang].fallback) || '跳转被阻止';
        DOM.statusText.textContent = '';
        DOM.ariaStatus.textContent = DOM.fallbackNote.textContent;
      }
    }

    // ---------- 启动 ----------
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && !redirected) {
        redirected = true;
        if (raf) cancelAnimationFrame(raf);
      }
    });

    // 系统主题变化监听
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      mq.addEventListener && mq.addEventListener('change', () => {
        const stored = localStorage.getItem('cm_theme');
        if (!stored || stored === 'auto') applyTheme('auto');
      });
    }

    // 首次保存
    (function persistDefaults() {
      if (!localStorage.getItem('cm_lang')) localStorage.setItem('cm_lang', currentLang);
      if (!localStorage.getItem('cm_theme')) localStorage.setItem('cm_theme', currentTheme);
    })();

    // 应用初始状态
    applyI18n(currentLang);
    applyTheme(currentTheme);
    initControls();
    raf = requestAnimationFrame(tick);

    console.info('[publish-redirect] config', { TARGET, DELAY_MS, lang: currentLang, theme: currentTheme, countdownActive });
  </script>
</body>
</html>
